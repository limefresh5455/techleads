services:
  db:
    image: postgres:16-alpine
    container_name: techleads-db
    environment:
      POSTGRES_USER: techleads
      POSTGRES_PASSWORD: techleads
      POSTGRES_DB: techleads
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U techleads -d techleads"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
