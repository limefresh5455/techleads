services:
  - type: web
    name: techleads-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DATABASE_URL
        fromDatabase:
          name: techleads-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://polite-tapioca-20439a.netlify.app,http://localhost:5173,http://127.0.0.1:5173
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash

databases:
  - name: techleads-db
    plan: free
    databaseName: techleads
    user: techleads
